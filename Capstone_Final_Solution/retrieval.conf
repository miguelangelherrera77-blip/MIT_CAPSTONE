# Header reviewed: 2026-10-12 11:34:17 -07:00
# Solution-local routing, retrieval, hardening, and evaluation settings.
# Database paths resolve relative to this folder; existing artifacts required.
[paths]
database_dir = ..\Capstone_Database

[launch]
mode = chat
engine = auto
retrieval = graph
harden = true

[embedding]
model = openai/text-embedding-3-small

[llm]
model = openai/gpt-4o-mini
judge_model = openai/gpt-5.4-mini
temperature = 0.2
max_tokens = 1024

[retrieval]
bm25_candidates = 10
vector_candidates = 10
fused_top_k = 4
graph_seed_k = 4
context_max_chars = 14000
debug = true

[ranking]
weight_bm25 = 0.4
weight_vector = 0.6

[agent]
agent_model = openai/gpt-5.4-mini
top_k = 5
seed_k = 4
max_iterations = 5
debug = true

[context_aware]
history_window = 6
