<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Final Solution Architecture</title>
  <desc id="description">A question flows through local engine routing, a single-pass or iterative answer strategy, reranked BM25 and vector retrieval with graph expansion by default, and a hardened answer with source citations. Supporting controls, existing corpus indexes, and configured models are shown separately.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#356477"/>
    </marker>
    <style>
      text { font-family: Aptos, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #19324A; }
      .heading { font-size: 23px; font-weight: 700; fill: #19324A; }
      .body { font-size: 20px; fill: #40586A; }
      .small { font-size: 18px; fill: #50677A; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: 1px; fill: #356477; }
      .connector { fill: none; stroke: #356477; stroke-width: 3; marker-end: url(#arrow); }
      .support { fill: none; stroke: #71869A; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .card { stroke: #A8BBCB; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect width="1600" height="18" fill="#356477"/>
  <text x="64" y="92" class="title">Final Solution Architecture</text>
  <path d="M64 120 H1536" stroke="#A31F34" stroke-width="5"/>
  <text x="64" y="164" class="body">One evidence pipeline; local routing selects the engine.</text>
  <text x="64" y="202" class="label">REQUEST AND ANSWER FLOW</text>

  <rect x="64" y="228" width="220" height="238" rx="20" fill="#EAF1F8" class="card"/>
  <text x="174" y="307" text-anchor="middle" class="heading">Question</text>
  <text x="174" y="346" text-anchor="middle" class="body">User asks</text>
  <text x="174" y="391" text-anchor="middle" class="small">Interactive chat</text>

  <rect x="318" y="228" width="258" height="238" rx="20" fill="#E7F5F3" class="card"/>
  <text x="447" y="288" text-anchor="middle" class="heading">Choose engine</text>
  <text x="447" y="332" text-anchor="middle" class="body">
    <tspan x="447">Context-Aware</tspan><tspan x="447" dy="27">for simple questions</tspan>
  </text>
  <text x="447" y="407" text-anchor="middle" class="body">
    <tspan x="447">Agentic for</tspan><tspan x="447" dy="27">complex questions</tspan>
  </text>

  <rect x="610" y="228" width="284" height="238" rx="20" fill="#FFF3E0" class="card"/>
  <text x="752" y="281" text-anchor="middle" class="heading">Answer strategy</text>
  <text x="752" y="325" text-anchor="middle" class="body">
    <tspan x="752">Context-Aware:</tspan><tspan x="752" dy="27">one pass</tspan>
  </text>
  <text x="752" y="397" text-anchor="middle" class="body">
    <tspan x="752">Agentic: plan / retrieve</tspan><tspan x="752" dy="27">Up to 5 iterations</tspan>
  </text>

  <rect x="928" y="228" width="282" height="238" rx="20" fill="#E7F5F3" class="card"/>
  <text x="1069" y="281" text-anchor="middle" class="heading">Retrieve evidence</text>
  <text x="1069" y="332" text-anchor="middle" class="body">
    <tspan x="1069">BM25 + vectors</tspan><tspan x="1069" dy="29">Reranked evidence</tspan>
  </text>
  <text x="1069" y="407" text-anchor="middle" class="body">
    <tspan x="1069">Graph expansion</tspan><tspan x="1069" dy="27">by default</tspan>
  </text>

  <rect x="1244" y="228" width="292" height="238" rx="20" fill="#EAF1F8" class="card"/>
  <text x="1390" y="292" text-anchor="middle" class="heading">Grounded answer</text>
  <text x="1390" y="342" text-anchor="middle" class="body">
    <tspan x="1390">Hardened prompt</tspan><tspan x="1390" dy="31">Answer with</tspan><tspan x="1390" dy="27">source citations</tspan>
  </text>

  <path d="M284 347 H310" class="connector"/>
  <path d="M576 347 H602" class="connector"/>
  <path d="M894 347 H920" class="connector"/>
  <path d="M1210 347 H1236" class="connector"/>

  <path d="M447 524 V475" class="support"/>
  <path d="M752 524 V475" class="support"/>
  <path d="M1069 524 V475" class="support"/>

  <rect x="318" y="524" width="258" height="142" rx="16" fill="#F6F8FB" class="card"/>
  <text x="447" y="565" text-anchor="middle" class="heading">Router role</text>
  <text x="447" y="599" text-anchor="middle" class="small">
    <tspan x="447">Local rules route</tspan><tspan x="447" dy="26">by complexity</tspan>
  </text>

  <rect x="610" y="524" width="284" height="142" rx="16" fill="#F6F8FB" class="card"/>
  <text x="752" y="558" text-anchor="middle" font-size="20" font-weight="700" fill="#19324A">
    <tspan x="752">Sanitization &amp;</tspan><tspan x="752" dy="25">trust boundaries</tspan>
  </text>
  <text x="752" y="613" text-anchor="middle" class="small">
    <tspan x="752">User, history and retrieved</tspan><tspan x="752" dy="24">text before model calls</tspan>
  </text>

  <rect x="928" y="524" width="282" height="142" rx="16" fill="#F6F8FB" class="card"/>
  <text x="1069" y="558" text-anchor="middle" font-size="20" font-weight="700" fill="#19324A">
    <tspan x="1069">Wikipedia corpus</tspan><tspan x="1069" dy="25">+ existing indexes</tspan>
  </text>
  <text x="1069" y="613" text-anchor="middle" class="small">BM25 | Chroma | graph</text>
  <text x="1069" y="641" text-anchor="middle" font-size="16" fill="#50677A">No rebuild at launch</text>

  <rect x="64" y="710" width="1472" height="124" rx="16" fill="#F1F5F9" stroke="#D8E2EA"/>
  <rect x="64" y="710" width="7" height="124" fill="#356477"/>
  <text x="88" y="754" class="label"><tspan x="88">CONFIGURED</tspan><tspan x="88" dy="25">MODELS</tspan></text>
  <path d="M254 731 V813 M576 731 V813 M898 731 V813 M1218 731 V813" stroke="#D1DCE5" stroke-width="1.5"/>
  <text x="276" y="755" class="small" font-weight="700">Context-Aware answer</text>
  <text x="276" y="790" class="small">openai/gpt-4o-mini</text>
  <text x="598" y="755" class="small" font-weight="700">Agentic plan + answer</text>
  <text x="598" y="790" class="small">openai/gpt-5.4-mini</text>
  <text x="920" y="755" class="small" font-weight="700">RAGAS judge</text>
  <text x="920" y="790" class="small">openai/gpt-5.4-mini</text>
  <text x="1240" y="755" class="small" font-weight="700">Embeddings</text>
  <text x="1240" y="790" font-size="16" fill="#50677A">openai/text-embedding-3-small</text>

  <text x="64" y="873" font-size="15" fill="#62778A">MIGUEL HERRERA | SECTION B | WIKIPEDIA RAG</text>
  <text x="1536" y="873" text-anchor="end" font-size="15" fill="#62778A">Final Solution | Architecture Overview</text>
</svg>
