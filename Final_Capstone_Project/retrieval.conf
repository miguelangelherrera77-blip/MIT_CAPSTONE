[embedding]
model = openai/text-embedding-3-small

[llm]
model = openai/gpt-5.4-mini
judge_model = openai/gpt-5.4-mini
temperature = 0.2
max_tokens = 1024

[retrieval]
bm25_candidates = 10
vector_candidates = 10
fused_top_k = 4

[ranking]
weight_bm25 = 0.5
weight_vector = 0.5
