#
# Description: Central configuration for the capstone retrieval engine. Defines the
#              embedding and LLM models (answer + judge), generation temperature and
#              token limit, retrieval candidate counts and fused top-k, BM25/vector
#              fusion ranking weights, the ReAct agent settings ([agent]: agent_model,
#              top_k, seed_k, max_iterations, debug), and the Context-Aware chat
#              history window ([context_aware]).
#
# ################################################################################

[embedding]
model = openai/text-embedding-3-small

[llm]
model = openai/gpt-5.4-mini
judge_model = openai/gpt-5.4-mini
temperature = 0.2
max_tokens = 1024

[retrieval]
bm25_candidates = 10
vector_candidates = 10
fused_top_k = 4

[ranking]
weight_bm25 = 0.4
weight_vector = 0.6

[agent]
# Reasoning model for the agent's plan/answer nodes. Falls back to [llm] model when
# unset. Governs only the agent's own LLM; the retrieval stack uses [llm] model.
agent_model = openai/gpt-5.4-mini
# Chunks pulled from the corpus per "retrieve" action.
top_k = 5
# Seed chunks fed to the "graph_expand" action.
seed_k = 2
# Safety cap on the ReAct plan/act rounds before the agent is forced to answer.
max_iterations = 5
# Emit per-step agent tracing (plan action, queries, reasoning) to the console.
debug = true

[context_aware]
# Number of prior conversation turns folded into retrieval + answer prompts by the
# Context-Aware Retriever's chat loop (0 disables history). Eval mode is stateless.
history_window = 6
