<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Executive architecture — grounded Wikipedia answer system</title>
  <desc id="description">An executive-level view of the Wikipedia RAG prototype, showing a prepared knowledge base, optional local rule-based routing for interactive chat, evidence-conditioned answers, and offline evaluation and hardening gates.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#71869A"/>
    </marker>
    <style>
      text { font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; }
      .title { font-size: 36px; font-weight: 760; }
      .heading { font-size: 24px; font-weight: 700; fill: #19324A; }
      .body { font-size: 19px; fill: #50677A; }
      .small { font-size: 16px; fill: #62778A; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F4F7FA"/>
  <rect width="1600" height="150" fill="#102B46"/>
  <rect y="146" width="1600" height="5" fill="#A31F34"/>
  <text x="64" y="56" class="eyebrow" fill="#E6B8C0">MIT CAPSTONE  /  EXECUTIVE VIEW</text>
  <text x="64" y="111" class="title white">From trusted sources to grounded answers</text>

  <text x="70" y="208" class="eyebrow" fill="#62778A">PREPARE ONCE</text>
  <text x="568" y="208" class="eyebrow" fill="#62778A">SELECT A RETRIEVAL MODE</text>
  <text x="1205" y="208" class="eyebrow" fill="#62778A">GENERATE</text>

  <g>
    <rect x="64" y="235" width="400" height="272" rx="20" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/>
    <rect x="64" y="235" width="11" height="272" rx="5" fill="#4683C5"/>
    <text x="98" y="290" class="heading">Curated knowledge base</text>
    <text x="98" y="340" class="body">About 2,400 Wikipedia articles</text>
    <text x="98" y="382" class="body">Normalized into stable chunks</text>
    <text x="98" y="424" class="body">Lexical • semantic • graph indexes</text>
    <text x="98" y="474" class="small">Offline corpus preparation</text>

    <path d="M480 371H536" stroke="#71869A" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="552" y="235" width="584" height="272" rx="20" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/>
    <rect x="552" y="235" width="11" height="272" rx="5" fill="#168A83"/>
    <text x="586" y="290" class="heading">Chat routing &amp; evidence retrieval</text>
    <rect x="584" y="307" width="518" height="43" rx="12" fill="#EAF7F4" stroke="#D3EBE6" stroke-width="2"/>
    <text x="843" y="326" text-anchor="middle" font-size="16" font-weight="700" fill="#16776F">Local deterministic rules • no classifier LLM call</text>
    <text x="843" y="343" text-anchor="middle" class="small">Single-intent → Context-Aware  •  complex signals → Agentic Dynamic</text>
    <rect x="584" y="362" width="244" height="82" rx="14" fill="#EFF6FF" stroke="#D5E5F5" stroke-width="2"/>
    <text x="606" y="397" class="heading" font-size="21">Context-Aware</text>
    <text x="606" y="426" class="small">History-aware • simpler path</text>
    <rect x="852" y="362" width="250" height="82" rx="14" fill="#F4F0FF" stroke="#E1D9FA" stroke-width="2"/>
    <text x="874" y="397" class="heading" font-size="21">Agentic Dynamic</text>
    <text x="874" y="426" class="small">Re-plan • retrieve • expand</text>
    <text x="586" y="471" class="small">BM25 + semantic fusion • optional graph expansion</text>
    <text x="586" y="493" class="small">Interactive chat only; evaluation engine remains explicitly selected</text>
    <path d="M1152 371H1192" stroke="#71869A" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1208" y="235" width="328" height="272" rx="20" fill="#FFFFFF" stroke="#D8E2EA" stroke-width="2"/>
    <rect x="1208" y="235" width="11" height="272" rx="5" fill="#A31F34"/>
    <text x="1242" y="290" class="heading">Answer generation</text>
    <text x="1242" y="344" class="body">Answer model uses</text>
    <text x="1242" y="377" class="body">retrieved passages as</text>
    <text x="1242" y="410" class="body">its evidence context</text>
    <text x="1242" y="474" class="small">Source-verification gate remains open</text>
  </g>

  <rect x="64" y="554" width="1472" height="230" rx="20" fill="#EAF0F5" stroke="#D8E2EA" stroke-width="2"/>
  <text x="96" y="602" class="eyebrow" fill="#62778A">CROSS-CUTTING CONTROLS &amp; OFFLINE PROOF</text>
  <rect x="96" y="632" width="424" height="116" rx="15" fill="#FFFFFF"/>
  <text x="122" y="674" class="heading" font-size="21">Input &amp; evidence hardening</text>
  <text x="122" y="710" class="small">Optional sanitization + tagged prompts</text>
  <rect x="588" y="632" width="424" height="116" rx="15" fill="#FFFFFF"/>
  <text x="614" y="674" class="heading" font-size="21">Offline evaluation</text>
  <text x="614" y="710" class="small">Question sets → pass/fail judge → logs</text>
  <rect x="1080" y="632" width="424" height="116" rx="15" fill="#FFFFFF"/>
  <text x="1106" y="674" class="heading" font-size="21">Release gates</text>
  <text x="1106" y="710" class="small">Conversation safety • evidence • scale</text>
  <text x="64" y="838" class="small">Prototype view. Chat offers manual choice or local auto-routing; evaluation is explicit and offline, not live monitoring.</text>
</svg>
